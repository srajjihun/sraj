<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영등포구청 모집·신청 공고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0B1416; --surface:#111C1F; --surface-2:#162326;
  --ink:#E8F0EE; --ink-2:#9FB4B4; --ink-3:#6E8386;
  --line:#213134; --accent:#5FC3AC; --accent-ink:#04201C;
  --tag-recruit:#4FA3D8; --tag-apply:#DCB13F;
  --r:12px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable","Outfit",system-ui,sans-serif;
  padding:32px 20px 80px;
}
.wrap{max-width:760px; margin:0 auto}
header{margin-bottom:28px}
h1{font-size:22px; font-weight:700; margin:0 0 6px}
.meta{color:var(--ink-3); font-size:13px}
.meta a{color:var(--accent)}
.list{display:flex; flex-direction:column; gap:10px}
.item{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 18px; display:flex; flex-direction:column; gap:6px;
}
.item-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tag{
  font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;
  color:var(--accent-ink);
}
.tag.recruit{background:var(--tag-recruit)}
.tag.apply{background:var(--tag-apply)}
.tag.new{background:var(--accent)}
.title{font-size:15px; font-weight:600; line-height:1.4}
.title a{color:var(--ink); text-decoration:none}
.title a:hover{color:var(--accent)}
.sub{color:var(--ink-3); font-size:12.5px; display:flex; gap:10px}
.empty{color:var(--ink-3); padding:40px 0; text-align:center; font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>영등포구청 모집·신청 공고</h1>
    <div class="meta" id="meta">불러오는 중...</div>
  </header>
  <div class="list" id="list"></div>
</div>

<script>
const DATA_URL = "data/ydp-posts.json";
const NEW_WITHIN_DAYS = 7;

function daysAgo(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return Infinity;
  return (Date.now() - d.getTime()) / 86400000;
}

function tagLabel(kw){
  return kw === "모집" ? "recruit" : "apply";
}

async function render(){
  const listEl = document.getElementById("list");
  const metaEl = document.getElementById("meta");
  let items = [];
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    items = await res.json();
  } catch (e) {
    metaEl.textContent = "데이터를 불러오지 못했습니다.";
    return;
  }

  items.sort((a, b) => Number(b.nttNo) - Number(a.nttNo));

  const newCount = items.filter(it => daysAgo(it.date) <= NEW_WITHIN_DAYS).length;
  metaEl.innerHTML = `총 ${items.length}건 · 최근 ${NEW_WITHIN_DAYS}일 내 ${newCount}건 · 원본 게시판: <a href="https://www.ydp.go.kr/www/selectBbsNttList.do?bbsNo=40&key=2848" target="_blank" rel="noopener">영등포구청 우리구소식</a>`;

  if (!items.length) {
    listEl.innerHTML = '<div class="empty">아직 수집된 글이 없습니다.</div>';
    return;
  }

  listEl.innerHTML = items.map(it => {
    const isNew = daysAgo(it.date) <= NEW_WITHIN_DAYS;
    return `
      <div class="item">
        <div class="item-top">
          <span class="tag ${tagLabel(it.matchedKeyword)}">${it.matchedKeyword}</span>
          ${isNew ? '<span class="tag new">NEW</span>' : ''}
          <span class="sub">${it.dept} · ${it.date}</span>
        </div>
        <div class="title"><a href="${it.url}" target="_blank" rel="noopener">${it.title}</a></div>
      </div>
    `;
  }).join("");
}

render();
</script>
</body>
</html>
