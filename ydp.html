<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모집·신청 레이더</title>
<meta name="description" content="영등포구청·서울시·기업마당·정부24의 모집/신청 공고를 매일 자동 수집해 한 표에서 보여주는 페이지">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --brand:#1266F1; --brand-deep:#0E56CC;
  --bg:#F6F8FC; --card:#FFFFFF; --line:#E3E8F2; --line-soft:#EEF1F7;
  --ink:#101828; --ink-2:#475467; --ink-3:#98A2B3;
  --c-ydp:#1266F1;   --c-ydp-text:#0E56CC;   --c-ydp-tint:#EAF1FE;
  --c-seoul:#0E8A6D; --c-seoul-text:#0B6E57; --c-seoul-tint:#E7F4F0;
  --c-biz:#B87E00;   --c-biz-text:#8A5F00;   --c-biz-tint:#F9F1DF;
  --c-gov:#A24FD8;   --c-gov-text:#7E3BAA;   --c-gov-tint:#F4EBFB;
  --danger:#B42318; --danger-tint:#FDECEA;
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  padding:20px 16px 28px;
}
.wrap{max-width:1200px; margin:0 auto}

/* ── header ── */
.topbar{display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:10px}
.logo-mark{width:36px; height:27px; display:block; flex:none}
.logo-name{font-size:20px; font-weight:800; letter-spacing:-.02em; color:var(--ink)}
.stats{display:flex; gap:7px; align-items:center; font-size:13.5px; flex-wrap:wrap}
.stat{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 14px; color:var(--ink-2)}
.stat b{font-weight:800; color:var(--ink)}
.stat.hot{background:var(--danger-tint); border-color:#F6CFC9}
.stat.hot b{color:var(--danger)}
.spacer{flex:1}
.updated{font-size:13px; color:var(--ink-3)}
.updated b{color:var(--ink-2); font-weight:600}

/* ── source link buttons ── */
.sources{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap}
.srclink{
  display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700;
  padding:9px 15px; border-radius:10px; text-decoration:none; color:#fff;
}
.srclink:hover{filter:brightness(1.08)}
.srclink .dot{width:7px; height:7px; border-radius:50%; background:#fff; opacity:.85}
.srclink small{font-weight:500; opacity:.85; font-size:12px}
.sl-ydp{background:var(--c-ydp)}
.sl-seoul{background:var(--c-seoul)}
.sl-biz{background:var(--c-biz)}
.sl-gov{background:var(--c-gov)}

/* ── filters ── */
.filters{display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; align-items:center}
.chip{
  font-family:inherit; font-size:13.5px; font-weight:600; padding:7px 14px;
  border-radius:999px; border:1px solid var(--line); background:var(--card);
  color:var(--ink-2); cursor:pointer;
}
.chip:hover{border-color:#C9D5EC}
.chip.active{background:var(--brand); border-color:var(--brand); color:#fff}
.chip .n{font-weight:500; opacity:.65; margin-left:2px; font-size:12.5px}
.chip.toggle{border-style:dashed}
.chip.toggle.active{border-style:solid}
.search{
  margin-left:auto; font-family:inherit; font-size:13.5px; color:var(--ink);
  background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:7px 13px; min-width:200px; outline:none;
}
.search:focus{border-color:var(--brand)}
.search::placeholder{color:var(--ink-3)}

/* ── table ── */
.sheet{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.tbl-scroll{overflow:auto; max-height:calc(100vh - 250px); min-height:320px}
.tbl-scroll::-webkit-scrollbar{width:10px; height:10px}
.tbl-scroll::-webkit-scrollbar-thumb{background:#C9D2E3; border-radius:6px}
.tbl-scroll::-webkit-scrollbar-track{background:transparent}
table{width:100%; border-collapse:collapse; font-size:14.5px}
thead th{
  background:#F0F3F9; color:var(--ink-2); font-size:13px; font-weight:700;
  text-align:left; padding:11px 14px; border-bottom:1px solid var(--line);
  white-space:nowrap; position:sticky; top:0; z-index:2; cursor:default;
}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--brand-deep)}
thead th.sorted{color:var(--brand-deep)}
thead th.sorted::after{content:" ▾"; font-size:10px}
thead th.sorted.asc::after{content:" ▴"}
tbody td{
  padding:10px 14px; border-bottom:1px solid var(--line-soft);
  vertical-align:middle; white-space:nowrap;
}
tbody tr{cursor:pointer}
tbody tr:nth-child(even){background:#FAFBFD}
tbody tr:hover{background:var(--c-ydp-tint)}
td.title{white-space:normal; min-width:360px}
td.title a{color:var(--ink); text-decoration:none; font-weight:600; line-height:1.45; font-size:15px}
td.title a:hover{color:var(--brand-deep); text-decoration:underline}
.src{font-size:12px; font-weight:700; padding:3.5px 10px; border-radius:999px; white-space:nowrap}
.s-ydp{background:var(--c-ydp-tint); color:var(--c-ydp-text)}
.s-seoul{background:var(--c-seoul-tint); color:var(--c-seoul-text)}
.s-biz{background:var(--c-biz-tint); color:var(--c-biz-text)}
.s-gov{background:var(--c-gov-tint); color:var(--c-gov-text)}
.new{display:inline-block; background:var(--brand); color:#fff; font-size:10.5px; font-weight:800; padding:2px 6.5px; border-radius:4px; margin-left:7px; vertical-align:1px}
td.num{color:var(--ink-2); font-variant-numeric:tabular-nums; font-size:14px}
td.org{color:var(--ink-2); max-width:170px; overflow:hidden; text-overflow:ellipsis; font-size:14px}
.dday{color:var(--danger); font-weight:800; background:var(--danger-tint); padding:2.5px 8px; border-radius:5px; font-size:12.5px; margin-left:7px}
.muted{color:var(--ink-3)}
.empty{padding:48px 20px; text-align:center; color:var(--ink-3); font-size:14.5px}

.foot{margin-top:12px; text-align:center; font-size:12.5px; color:var(--ink-3)}
.foot b{color:var(--ink-2)}

@media (max-width:720px){
  body{padding:14px 10px 22px}
  .logo-name{font-size:18px}
  .search{margin-left:0; width:100%}
  .tbl-scroll{max-height:calc(100vh - 330px)}
  td.title{min-width:260px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 100 76" role="img" aria-label="모집·신청 레이더 로고">
        <defs>
          <radialGradient id="lamp" gradientUnits="userSpaceOnUse" cx="50" cy="47" r="40">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="14%" stop-color="#DCF1FF"/>
            <stop offset="34%" stop-color="#5EB2FB"/>
            <stop offset="66%" stop-color="#0F7CF2"/>
            <stop offset="100%" stop-color="#0566EE"/>
          </radialGradient>
          <path id="wing" d="M 22.2,5.4 C 13.2,1.6 4.6,5.4 0.8,13.6 C 3.2,32.5 8.4,56.5 13.8,69.4 C 15.4,73.2 19.4,74.4 22.4,72.0 C 25.2,69.8 26.9,68.0 26.8,64.8 L 24.6,11.2 C 24.5,7.9 24.0,6.2 22.2,5.4 Z"/>
        </defs>
        <use href="#wing" fill="url(#lamp)"/>
        <use href="#wing" fill="url(#lamp)" transform="translate(100,0) scale(-1,1)"/>
        <path fill="url(#lamp)" d="M 30.6,6.2 C 30.6,2.3 39.2,0 50,0 C 60.8,0 69.4,2.3 69.4,6.2 L 68.6,68.6 C 68.6,72.6 66.4,74.8 62.4,74.8 L 37.6,74.8 C 33.6,74.8 31.4,72.6 31.4,68.6 Z"/>
      </svg>
      <div class="logo-name">모집·신청 레이더</div>
    </div>
    <div class="stats">
      <span class="stat">전체 <b id="st-total">–</b></span>
      <span class="stat">최근 7일 <b id="st-new">–</b></span>
      <span class="stat hot">마감임박 <b id="st-due">–</b></span>
    </div>
    <span class="spacer"></span>
    <div class="updated" id="updated"></div>
  </div>

  <div class="sources">
    <a class="srclink sl-ydp" target="_blank" rel="noopener"
       href="https://www.ydp.go.kr/www/selectBbsNttList.do?key=2848&bbsNo=40&searchCnd=SJ&searchKrwd=%EB%AA%A8%EC%A7%91&pageUnit=50">
      <span class="dot"></span>영등포구청 <small>바로가기 ↗</small></a>
    <a class="srclink sl-seoul" target="_blank" rel="noopener"
       href="https://www.seoul.go.kr/realmnews/in/list.do?fetchStart=1&siteId=&detailChktxt=%EB%AA%A8%EC%A7%91%7C%EC%8B%A0%EC%B2%AD&detailChk=%EB%AA%A8%EC%A7%91&detailChk=%EC%8B%A0%EC%B2%AD&sDate=&eDate=&searchWord=">
      <span class="dot"></span>서울시 새소식 <small>바로가기 ↗</small></a>
    <a class="srclink sl-biz" target="_blank" rel="noopener"
       href="https://www.bizinfo.go.kr/sie/siea/selectSIEA430View.do?condition=TITLE&area=cap&rows=15&cpage=1">
      <span class="dot"></span>기업마당 <small>바로가기 ↗</small></a>
    <a class="srclink sl-gov" target="_blank" rel="noopener"
       href="https://www.gov.kr/portal/locgovNews?srchOrder=&sido=1100000000&signgu=0000000000&srchArea=1100000000&srchSidoArea=&srchStDtFmt=&srchEdDtFmt=&srchTxt=%EB%AA%A8%EC%A7%91&initSrch=false&pageIndex=1">
      <span class="dot"></span>정부24 지자체소식 <small>바로가기 ↗</small></a>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-src="all">전체 <span class="n" id="n-all"></span></button>
    <button class="chip" data-src="ydp">영등포구청 <span class="n" id="n-ydp"></span></button>
    <button class="chip" data-src="seoul">서울시 <span class="n" id="n-seoul"></span></button>
    <button class="chip" data-src="biz">기업마당 <span class="n" id="n-biz"></span></button>
    <button class="chip" data-src="gov">정부24 <span class="n" id="n-gov"></span></button>
    <button class="chip toggle" id="tg-new">NEW만</button>
    <button class="chip toggle" id="tg-due">마감임박만</button>
    <input class="search" id="search" type="search" placeholder="🔍 제목 검색…">
  </div>

  <div class="sheet"><div class="tbl-scroll">
    <table>
      <thead>
        <tr>
          <th style="width:100px">소스</th>
          <th>제목</th>
          <th style="width:150px">부서/기관</th>
          <th class="sortable sorted" id="th-date" style="width:92px">등록일</th>
          <th class="sortable" id="th-deadline" style="width:130px">신청일자</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>표시할 공고가 없습니다.</div>
  </div></div>

  <div class="foot">매일 아침 <b>07:00</b> 자동 수집 · 영등포구청 / 서울시 / 기업마당 / 정부24 · 행 클릭 시 원문이 새 창으로 열립니다</div>

</div>

<script>
"use strict";

const NEW_DAYS = 7;      // 등록 후 7일 이내면 NEW
const DUE_SOON_DAYS = 7; // 마감이 7일 이내로 남으면 마감임박

const state = { src: "all", newOnly: false, dueOnly: false, q: "", sortKey: "date", sortDir: -1 };
let items = [];

/* ── helpers ── */
function decodeEntities(s) {
  if (!s) return "";
  return String(s)
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
    .replace(/&amp;/g, "&");
}

function parseDay(iso) { // "YYYY-MM-DD" -> UTC ms (자정 기준), 실패 시 null
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null;
}

const todayMs = (() => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); })();
const DAY = 86400000;

function daysUntil(iso) { // 마감까지 남은 일수 (음수면 지남)
  const t = parseDay(iso);
  return t === null ? null : Math.round((t - todayMs) / DAY);
}
function daysSince(iso) {
  const t = parseDay(iso);
  return t === null ? null : Math.round((todayMs - t) / DAY);
}
function fmtShort(iso) { // "YYYY-MM-DD" -> "MM.DD"
  const m = /^\d{4}-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? `${m[1]}.${m[2]}` : "";
}

function periodEnd(period) { // "YYYY-MM-DD ~ YYYY-MM-DD" -> 종료일
  const m = /~\s*(\d{4}-\d{2}-\d{2})/.exec(period || "");
  return m ? m[1] : null;
}

/* ── normalize ── */
const SOURCES = {
  ydp:   { label: "영등포구청", cls: "s-ydp" },
  seoul: { label: "서울시",     cls: "s-seoul" },
  biz:   { label: "기업마당",   cls: "s-biz" },
  gov:   { label: "정부24",     cls: "s-gov" },
};

function normalize(src, raw) {
  const title = decodeEntities(raw.title);
  let deadline = raw.deadline || null;
  if (src === "biz") deadline = periodEnd(raw.period);
  return {
    src,
    title,
    org: decodeEntities(raw.org || raw.dept || (src === "seoul" ? "서울시" : "")),
    date: raw.date || "",
    deadline,
    url: raw.url,
  };
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  return res.json();
}

/* ── render ── */
function visibleItems() {
  const q = state.q.trim().toLowerCase();
  let list = items.filter(it => {
    if (state.src !== "all" && it.src !== state.src) return false;
    if (state.newOnly && !(daysSince(it.date) !== null && daysSince(it.date) <= NEW_DAYS)) return false;
    if (state.dueOnly) {
      const left = daysUntil(it.deadline);
      if (left === null || left < 0 || left > DUE_SOON_DAYS) return false;
    }
    if (q && !it.title.toLowerCase().includes(q)) return false;
    return true;
  });
  const key = state.sortKey;
  list.sort((a, b) => {
    const av = a[key] || "", bv = b[key] || "";
    if (av === bv) return (b.date || "").localeCompare(a.date || "");
    if (!av) return 1; // 값 없는 행은 항상 뒤로
    if (!bv) return -1;
    return av < bv ? -state.sortDir : state.sortDir;
  });
  return list;
}

function render() {
  const tbody = document.getElementById("rows");
  const list = visibleItems();
  tbody.textContent = "";
  document.getElementById("empty").hidden = list.length > 0;

  const frag = document.createDocumentFragment();
  for (const it of list) {
    const tr = document.createElement("tr");

    const tdSrc = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = `src ${SOURCES[it.src].cls}`;
    badge.textContent = SOURCES[it.src].label;
    tdSrc.appendChild(badge);

    const tdTitle = document.createElement("td");
    tdTitle.className = "title";
    const a = document.createElement("a");
    a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = it.title;
    tdTitle.appendChild(a);
    if (daysSince(it.date) !== null && daysSince(it.date) <= NEW_DAYS) {
      const n = document.createElement("span");
      n.className = "new"; n.textContent = "N";
      tdTitle.appendChild(n);
    }

    const tdOrg = document.createElement("td");
    tdOrg.className = "org"; tdOrg.textContent = it.org;
    tdOrg.title = it.org;

    const tdDate = document.createElement("td");
    tdDate.className = "num"; tdDate.textContent = fmtShort(it.date);

    const tdDead = document.createElement("td");
    tdDead.className = "num";
    if (it.deadline) {
      tdDead.textContent = fmtShort(it.deadline);
      const left = daysUntil(it.deadline);
      if (left !== null && left >= 0 && left <= DUE_SOON_DAYS) {
        const d = document.createElement("span");
        d.className = "dday"; d.textContent = `D-${left === 0 ? "DAY" : left}`;
        tdDead.appendChild(d);
      } else if (left !== null && left < 0) {
        tdDead.classList.add("muted");
      }
    } else {
      const m = document.createElement("span");
      m.className = "muted"; m.textContent = "—";
      tdDead.appendChild(m);
    }

    tr.append(tdSrc, tdTitle, tdOrg, tdDate, tdDead);
    tr.addEventListener("click", (e) => {
      if (e.target.closest("a")) return; // 링크 클릭은 그대로
      window.open(it.url, "_blank", "noopener");
    });
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

function renderStats() {
  const total = items.length;
  const newCount = items.filter(it => daysSince(it.date) !== null && daysSince(it.date) <= NEW_DAYS).length;
  const dueCount = items.filter(it => {
    const left = daysUntil(it.deadline);
    return left !== null && left >= 0 && left <= DUE_SOON_DAYS;
  }).length;
  document.getElementById("st-total").textContent = total;
  document.getElementById("st-new").textContent = newCount;
  document.getElementById("st-due").textContent = dueCount;
  document.getElementById("n-all").textContent = total;
  for (const src of ["ydp", "seoul", "biz", "gov"]) {
    document.getElementById(`n-${src}`).textContent = items.filter(it => it.src === src).length;
  }
}

/* ── events ── */
document.getElementById("filters").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip[data-src]");
  if (!chip) return;
  document.querySelectorAll(".chip[data-src]").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  state.src = chip.dataset.src;
  render();
});
document.getElementById("tg-new").addEventListener("click", (e) => {
  state.newOnly = !state.newOnly;
  e.currentTarget.classList.toggle("active", state.newOnly);
  render();
});
document.getElementById("tg-due").addEventListener("click", (e) => {
  state.dueOnly = !state.dueOnly;
  e.currentTarget.classList.toggle("active", state.dueOnly);
  render();
});
document.getElementById("search").addEventListener("input", (e) => {
  state.q = e.target.value;
  render();
});
for (const [thId, key] of [["th-date", "date"], ["th-deadline", "deadline"]]) {
  document.getElementById(thId).addEventListener("click", () => {
    if (state.sortKey === key) {
      state.sortDir *= -1;
    } else {
      state.sortKey = key; state.sortDir = -1;
    }
    document.querySelectorAll("thead th.sortable").forEach(th => th.classList.remove("sorted", "asc"));
    const th = document.getElementById(thId);
    th.classList.add("sorted");
    if (state.sortDir === 1) th.classList.add("asc");
    render();
  });
}

/* ── boot ── */
(async function boot() {
  const files = [
    ["ydp", "data/ydp-posts.json"],
    ["seoul", "data/seoul-posts.json"],
    ["biz", "data/bizinfo-posts.json"],
    ["gov", "data/govkr-posts.json"],
  ];
  const results = await Promise.allSettled(files.map(([, url]) => fetchJson(url)));
  const failed = [];
  results.forEach((r, i) => {
    const [src] = files[i];
    if (r.status === "fulfilled" && Array.isArray(r.value)) {
      for (const raw of r.value) items.push(normalize(src, raw));
    } else {
      failed.push(SOURCES[src].label);
    }
  });

  // 마지막 수집 시각: firstSeenAt 최댓값
  let lastSeen = "";
  results.forEach(r => {
    if (r.status !== "fulfilled" || !Array.isArray(r.value)) return;
    for (const raw of r.value) {
      if (raw.firstSeenAt && raw.firstSeenAt > lastSeen) lastSeen = raw.firstSeenAt;
    }
  });
  const updatedEl = document.getElementById("updated");
  if (lastSeen) {
    const d = new Date(lastSeen);
    const kst = new Date(d.getTime() + 9 * 3600000);
    const pad = n => String(n).padStart(2, "0");
    updatedEl.innerHTML = `마지막 수집 <b>${kst.getUTCFullYear()}.${pad(kst.getUTCMonth() + 1)}.${pad(kst.getUTCDate())}</b> · 매일 자동`;
  }
  if (failed.length) {
    updatedEl.innerHTML += ` · <span style="color:var(--danger)">${failed.join(", ")} 로드 실패</span>`;
  }

  renderStats();
  render();
})();
</script>
</body>
</html>
