<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!-- 바깥에서 아무것도 불러오지 않는 화면이라 전부 막아둔다 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'" />
<title>월야 뽀모도로</title>
<style>
  :root {
    --gold:       #e3b45f;
    --gold-hi:    #f7dda3;
    --gold-dim:   #8b6c34;
    --accent:     var(--gold);
    --accent-hi:  var(--gold-hi);
  }

  /* 휴식 중에는 금빛에서 달빛(상아색)으로 넘어간다 */
  body.rest {
    --accent:    #d9cfb2;
    --accent-hi: #f2ecda;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 180px;
    height: 180px;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic',
                 -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 원반 본체 (240px로 설계된 내용을 통째로 축소해서 담는다) ── */
  #card {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.75);
    transform-origin: center;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    overflow: hidden;
    background:
      radial-gradient(90% 70% at 72% 14%, rgba(227,180,95,.10), transparent 62%),
      linear-gradient(180deg, #0a0806 0%, #050403 58%, #070505 100%);
    border: 1px solid rgba(227,180,95,.24);
    box-shadow: inset 0 1px 0 rgba(247,221,163,.07);
    -webkit-app-region: drag;
    transition: border-color .6s ease;
  }
  body.rest #card { border-color: rgba(217,207,178,.20); }

  /* 별 */
  #stars { position: absolute; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    width: 1.4px; height: 1.4px;
    border-radius: 50%;
    background: var(--gold-hi);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .10; }
    50%      { opacity: .50; }
  }

  /* ── 상단 아이콘 ──────────────────────────────────────── */
  #tools {
    position: absolute;
    top: 30px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex; gap: 3px;
    -webkit-app-region: no-drag;
  }
  .tool {
    width: 18px; height: 18px;
    display: grid; place-items: center;
    border: 0; border-radius: 5px;
    background: rgba(227,180,95,.06);
    color: var(--gold-dim);
    opacity: .7;
    cursor: pointer;
    transition: opacity .16s, background .16s, color .16s;
  }
  .tool:hover { opacity: 1; background: rgba(227,180,95,.14); color: var(--gold); }
  .tool.on    { opacity: 1; color: var(--gold-hi); background: rgba(227,180,95,.14); }
  .tool svg   { display: block; }

  /* ── 달 다이얼 (원반 전체를 채운다) ───────────────────── */
  #dial { position: absolute; inset: 0; z-index: 3; }
  #dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .track  { fill: none; stroke: rgba(227,180,95,.11); stroke-width: 1.4; }
  .tick   { stroke: #e3b45f; stroke-width: 1; stroke-linecap: round; }
  .arc {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 100px 100px;
    filter: drop-shadow(0 0 5px rgba(227,180,95,.5));
    transition: stroke .6s ease;
  }
  #head {
    fill: var(--accent-hi);
    filter: drop-shadow(0 0 5px rgba(247,221,163,.85));
    transition: fill .6s ease;
  }
  .moonline { fill: none; stroke: var(--accent); stroke-width: .9; opacity: .22; transition: stroke .6s ease; }
  .moonedge { fill: none; stroke: var(--accent); stroke-width: .8; opacity: .16; transition: stroke .6s ease; }

  /* ── 다이얼 위 글자 ───────────────────────────────────── */
  #face {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    pointer-events: none;
  }
  #mode {
    font-size: 13px;
    letter-spacing: .34em;
    padding-left: .34em;
    color: var(--accent);
    opacity: .8;
    transition: color .6s ease;
  }
  #time {
    font-size: 57px;
    font-weight: 200;
    letter-spacing: 0;
    line-height: 1;
    color: var(--accent-hi);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(227,180,95,.32);
    transition: color .6s ease;
  }
  #dots { display: flex; gap: 4px; height: 4px; }
  .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    border: 1px solid rgba(227,180,95,.38);
    transition: background .35s ease, box-shadow .35s ease;
  }
  .dot.done {
    background: var(--gold);
    box-shadow: 0 0 5px rgba(227,180,95,.7);
  }

  /* ── 아래쪽 원형 버튼 ─────────────────────────────────── */
  #controls {
    position: absolute;
    bottom: 34px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex; gap: 9px;
    -webkit-app-region: no-drag;
  }
  .iconbtn {
    width: 35px; height: 35px;
    border-radius: 50%;
    border: 1px solid rgba(227,180,95,.34);
    background: rgba(227,180,95,.06);
    display: grid; place-items: center;
    color: var(--gold-hi);
    cursor: pointer;
    transition: background .18s, border-color .18s, transform .1s;
  }
  .iconbtn:hover  { background: rgba(227,180,95,.16); border-color: rgba(227,180,95,.6); }
  .iconbtn:active { transform: translateY(1px); }
  .iconbtn.primary {
    background: rgba(227,180,95,.14);
    border-color: rgba(227,180,95,.55);
  }
  .iconbtn svg { display: block; }

  #icoPause { display: none; }
  body.running #icoPlay  { display: none; }
  body.running #icoPause { display: block; }

  /* ── 파도 ─────────────────────────────────────────────── */
  #sea {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 72px;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
    mask-image: linear-gradient(180deg, transparent, #000 46%);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 46%);
  }
  #sea svg { position: absolute; bottom: 0; left: 0; width: 480px; height: 72px; }
  #sea .w1 { animation: drift 26s linear infinite; opacity: .40; }
  #sea .w2 { animation: drift 38s linear infinite; opacity: .24; }
  #sea .w3 { animation: drift 54s linear infinite; opacity: .14; }
  @keyframes drift { to { transform: translateX(-120px); } }

  .wave  { fill: none; stroke: var(--gold); stroke-width: 1; stroke-linecap: round; transition: stroke .6s ease; }
  .foam  { fill: var(--gold); transition: fill .6s ease; }

  /* 달리는 중에만 파도가 살아난다 */
  #sea .w1, #sea .w2, #sea .w3 { animation-play-state: paused; }
  body.running #sea .w1,
  body.running #sea .w2,
  body.running #sea .w3 { animation-play-state: running; }

  /* ── 설정 (원반을 덮는 판) ────────────────────────────── */
  #settings {
    position: absolute;
    inset: 0;
    z-index: 6;
    border-radius: 50%;
    background: #060504;
    border: 1px solid rgba(227,180,95,.18);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 40px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s ease, visibility .2s;
    -webkit-app-region: no-drag;
  }
  #settings.open { opacity: 1; visibility: visible; }
  #settings h2 {
    font-size: 8px; font-weight: 400;
    letter-spacing: .3em; color: var(--gold-dim);
    text-align: center;
    margin-bottom: 9px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(227,180,95,.07);
  }
  .row:last-of-type { border-bottom: 0; }
  .row span { font-size: 10px; color: rgba(247,221,163,.72); letter-spacing: .03em; }
  .stepper { display: flex; align-items: center; gap: 2px; }
  .stepper button {
    width: 17px; height: 17px;
    border: 1px solid rgba(227,180,95,.24);
    border-radius: 5px;
    background: transparent;
    color: var(--gold);
    font-size: 11px; line-height: 1;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .stepper button:hover { background: rgba(227,180,95,.14); border-color: rgba(227,180,95,.55); }
  .stepper b {
    min-width: 30px; text-align: center;
    font-size: 10.5px; font-weight: 400;
    color: var(--gold-hi);
    font-variant-numeric: tabular-nums;
  }
  .stepper b::after {
    content: '분';
    font-size: 8px;
    color: var(--gold-dim);
    margin-left: 1px;
  }
  #settings footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 9px;
    margin-top: 5px;
    border-top: 1px solid rgba(227,180,95,.07);
  }
  #settings footer button {
    border: 0; background: transparent;
    font-family: inherit; font-size: 9px; letter-spacing: .12em;
    color: var(--gold-dim); cursor: pointer;
    transition: color .15s;
  }
  #settings footer button:hover { color: var(--gold); }
  #quit:hover { color: #d98b6a; }
</style>
</head>
<body>

<div id="card">
  <div id="stars"></div>

  <!-- 상단 아이콘 -->
  <div id="tools">
    <button class="tool" id="btnPin" title="항상 맨 앞에">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2.4 3.2H6.6L9 10.8z"/>
      </svg>
    </button>
    <button class="tool" id="btnCog" title="설정">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2 5.4 5.4"/>
      </svg>
    </button>
    <button class="tool" id="btnHide" title="숨기기 (트레이에서 다시 열기)">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M5 12h14"/>
      </svg>
    </button>
  </div>

  <!-- 달 다이얼 -->
  <div id="dial">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="moonGlow" cx="50%" cy="46%" r="52%">
          <stop offset="0%"   stop-color="#e3b45f" stop-opacity=".17"/>
          <stop offset="62%"  stop-color="#e3b45f" stop-opacity=".055"/>
          <stop offset="100%" stop-color="#e3b45f" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="moonClip"><circle cx="100" cy="100" r="76"/></clipPath>
      </defs>

      <!-- 달 원반 -->
      <circle cx="100" cy="100" r="76" fill="url(#moonGlow)"/>
      <circle class="moonedge" cx="100" cy="100" r="76"/>

      <!-- 달을 가로지르는 구름 (배경화면의 달 문양) -->
      <g clip-path="url(#moonClip)">
        <path class="moonline"
              d="M22 122 C 38 122 43 113 57 113 C 69 113 71 122 87 122 C 103 122 107 114 121 114 C 135 114 137 122 153 122 L 178 122"/>
        <path class="moonline"
              d="M28 138 C 42 138 47 131 59 131 C 71 131 73 138 87 138 L 172 138"/>
        <path class="moonline"
              d="M48 152 C 60 152 64 146 75 146 C 86 146 88 152 99 152 L 156 152"/>
      </g>

      <!-- 눈금 -->
      <g id="ticks"></g>

      <!-- 진행 고리 -->
      <circle class="track" cx="100" cy="100" r="92"/>
      <circle class="arc" id="arc" cx="100" cy="100" r="92"/>
      <circle id="head" cx="100" cy="8" r="2.8" opacity="0"/>
    </svg>

    <div id="face">
      <div id="mode">집 중</div>
      <div id="time">25:00</div>
      <div id="dots"></div>
    </div>
  </div>

  <!-- 아래쪽 버튼 -->
  <div id="controls">
    <button class="iconbtn primary" id="btnPlay" title="시작 / 일시정지 (Space)">
      <svg id="icoPlay" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5.2 19.2 12 8 18.8z"/>
      </svg>
      <svg id="icoPause" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6.5" y="5" width="3.8" height="14" rx="1.2"/>
        <rect x="13.7" y="5" width="3.8" height="14" rx="1.2"/>
      </svg>
    </button>
    <button class="iconbtn" id="btnReset" title="초기화 (R)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
      </svg>
    </button>
  </div>

  <!-- 파도 -->
  <div id="sea">
    <svg viewBox="0 0 480 72" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <g class="w3" transform="translate(0,22)"><g id="waveC"></g></g>
      <g class="w2" transform="translate(0,37)"><g id="waveB"></g></g>
      <g class="w1" transform="translate(0,49)"><g id="waveA"></g></g>
    </svg>
  </div>

  <!-- 설정 -->
  <div id="settings">
    <h2>시간 설정</h2>
    <div class="row">
      <span>집중</span>
      <div class="stepper" data-key="focus">
        <button data-d="-1">−</button><b>25</b><button data-d="1">+</button>
      </div>
    </div>
    <div class="row">
      <span>짧은 휴식</span>
      <div class="stepper" data-key="short">
        <button data-d="-1">−</button><b>5</b><button data-d="1">+</button>
      </div>
    </div>
    <div class="row">
      <span>긴 휴식</span>
      <div class="stepper" data-key="long">
        <button data-d="-1">−</button><b>15</b><button data-d="1">+</button>
      </div>
    </div>
    <footer>
      <button id="quit">종료</button>
      <button id="closeSettings">닫기</button>
    </footer>
  </div>
</div>

<script>
'use strict';

/* ────────────────────────────────────────────────────────── *
 * 배경 장식 — 별, 눈금, 파도
 * ────────────────────────────────────────────────────────── */

// 별은 눈금과 시각 사이의 빈 띠에만 뿌린다 — 숫자 위에 겹치지 않게.
(function paintStars() {
  const host = document.getElementById('stars');
  const C = 120;            // 원반 중심
  const INNER = 84, OUTER = 98;
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = INNER + Math.random() * (OUTER - INNER);
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = (C + r * Math.cos(a)).toFixed(1) + 'px';
    s.style.top = (C + r * Math.sin(a)).toFixed(1) + 'px';
    s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
    s.style.animationDuration = (3 + Math.random() * 3).toFixed(2) + 's';
    host.appendChild(s);
  }
})();

(function paintTicks() {
  const g = document.getElementById('ticks');
  const ns = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
    const r1 = major ? 83 : 85;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('class', 'tick');
    line.setAttribute('x1', (100 + r1 * Math.cos(a)).toFixed(2));
    line.setAttribute('y1', (100 + r1 * Math.sin(a)).toFixed(2));
    line.setAttribute('x2', (100 + 88 * Math.cos(a)).toFixed(2));
    line.setAttribute('y2', (100 + 88 * Math.sin(a)).toFixed(2));
    line.setAttribute('opacity', major ? '.42' : '.16');
    g.appendChild(line);
  }
})();

// 우키요에풍 물마루 한 장을 가로로 이어 붙인다.
(function paintWaves() {
  const ns = 'http://www.w3.org/2000/svg';
  const UNIT = 120;
  const crest =
    'M0,26 C 10,25 18,22 26,14 C 33,8 41,2 50,2 C 58,2 63,8 61,14 ' +
    'C 66,10 72,12 74,18 C 77,22 82,26 87,24 C 95,22 103,20 111,23 ' +
    'C 115,24 118,25 120,26';
  const curl = 'M48,5 C 55,6 58,11 53,14 C 50,16 47,15 46,13';

  [['waveA', 1], ['waveB', 0.82], ['waveC', 0.66]].forEach(([id, scale], layer) => {
    const g = document.getElementById(id);
    for (let i = 0; i < 6; i++) {
      const unit = document.createElementNS(ns, 'g');
      unit.setAttribute(
        'transform',
        `translate(${i * UNIT * scale - layer * 32}, 0) scale(${scale})`
      );

      const p = document.createElementNS(ns, 'path');
      p.setAttribute('class', 'wave');
      p.setAttribute('d', crest);
      unit.appendChild(p);

      const c = document.createElementNS(ns, 'path');
      c.setAttribute('class', 'wave');
      c.setAttribute('d', curl);
      c.setAttribute('opacity', '.7');
      unit.appendChild(c);

      // 물보라
      [[45, 1], [56, 4], [85, 22]].forEach(([fx, fy], k) => {
        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('class', 'foam');
        dot.setAttribute('cx', fx);
        dot.setAttribute('cy', fy);
        dot.setAttribute('r', k === 1 ? 0.7 : 0.95);
        dot.setAttribute('opacity', '.6');
        unit.appendChild(dot);
      });

      g.appendChild(unit);
    }
  });
})();

/* ────────────────────────────────────────────────────────── *
 * 타이머
 * ────────────────────────────────────────────────────────── */

const R = 92;
const CIRC = 2 * Math.PI * R;

const el = {
  body:    document.body,
  arc:     document.getElementById('arc'),
  head:    document.getElementById('head'),
  time:    document.getElementById('time'),
  mode:    document.getElementById('mode'),
  dots:    document.getElementById('dots'),
  play:    document.getElementById('btnPlay'),
  reset:   document.getElementById('btnReset'),
  pin:     document.getElementById('btnPin'),
  cog:     document.getElementById('btnCog'),
  hide:    document.getElementById('btnHide'),
  panel:   document.getElementById('settings'),
};

el.arc.style.strokeDasharray = CIRC.toFixed(2);
el.arc.style.strokeDashoffset = CIRC.toFixed(2);

const LABEL = { focus: '집 중', short: '휴 식', long: '긴 휴 식' };
const LIMITS = { focus: [1, 90], short: [1, 30], long: [1, 60] };

let durations = { focus: 25, short: 5, long: 15 };
let roundsBeforeLong = 4;

let mode = 'focus';
let running = false;
let remaining = durations.focus * 60 * 1000; // 남은 밀리초
let endAt = 0;                               // 진행 중일 때의 종료 시각
let round = 0;                               // 이번 묶음에서 끝낸 집중 횟수
let ticker = null;

const totalMs = () => durations[mode] * 60 * 1000;

function render() {
  const ms = running ? Math.max(0, endAt - Date.now()) : remaining;
  const secs = Math.ceil(ms / 1000);
  const mm = String(Math.floor(secs / 60)).padStart(2, '0');
  const ss = String(secs % 60).padStart(2, '0');
  el.time.textContent = `${mm}:${ss}`;

  const p = Math.min(1, Math.max(0, 1 - ms / totalMs()));
  el.arc.style.strokeDashoffset = (CIRC * (1 - p)).toFixed(2);

  if (p > 0.001 && p < 0.999) {
    const a = p * Math.PI * 2 - Math.PI / 2;
    el.head.setAttribute('cx', (100 + R * Math.cos(a)).toFixed(2));
    el.head.setAttribute('cy', (100 + R * Math.sin(a)).toFixed(2));
    el.head.setAttribute('opacity', '1');
  } else {
    el.head.setAttribute('opacity', '0');
  }

  el.mode.textContent = LABEL[mode];
  el.body.classList.toggle('rest', mode !== 'focus');
  el.body.classList.toggle('running', running);
}

function paintDots() {
  el.dots.innerHTML = '';
  for (let i = 0; i < roundsBeforeLong; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < round ? ' done' : '');
    el.dots.appendChild(d);
  }
}

function tick() {
  if (!running) return;
  if (Date.now() >= endAt) {
    advance();
    return;
  }
  render();
}

function start() {
  if (running) return;
  running = true;
  endAt = Date.now() + remaining;
  clearInterval(ticker);
  ticker = setInterval(tick, 200);
  render();
}

function pause() {
  if (!running) return;
  remaining = Math.max(0, endAt - Date.now());
  running = false;
  clearInterval(ticker);
  render();
}

function toggle() {
  running ? pause() : start();
}

function setMode(next, autoStart) {
  mode = next;
  remaining = totalMs();
  running = false;
  clearInterval(ticker);
  render();
  if (autoStart) start();
}

function reset() {
  running = false;
  clearInterval(ticker);
  round = 0;
  setMode('focus', false);
  paintDots();
}

// 한 구간이 끝났을 때 — 알리고 다음 구간을 이어서 시작한다.
function advance() {
  const finished = mode;
  let next, title, body;

  if (finished === 'focus') {
    round += 1;
    const longNow = round >= roundsBeforeLong;
    next = longNow ? 'long' : 'short';
    title = '집중 완료';
    body = longNow
      ? `${durations.long}분 긴 휴식을 시작합니다. 잠시 창을 보세요.`
      : `${durations.short}분 휴식을 시작합니다.`;
    if (longNow) round = 0;
  } else {
    next = 'focus';
    title = '휴식 종료';
    body = `${durations.focus}분 집중을 시작합니다.`;
  }

  paintDots();
  chime(finished === 'focus');
  window.api?.notify(title, body);
  window.api?.flash();
  setMode(next, true);
}

/* ── 종소리 (파일 없이 합성) ─────────────────────────────── */
let audioCtx = null;
function chime(deep) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const base = deep ? 392 : 523.25; // 집중 끝은 낮게, 휴식 끝은 밝게
    const now = audioCtx.currentTime;

    [[1, 0.5], [2.01, 0.2], [2.98, 0.08]].forEach(([mult, gain]) => {
      const osc = audioCtx.createOscillator();
      const amp = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = base * mult;
      amp.gain.setValueAtTime(0, now);
      amp.gain.linearRampToValueAtTime(gain * 0.28, now + 0.012);
      amp.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
      osc.connect(amp).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 2.7);
    });
  } catch {
    /* 소리를 못 내도 타이머는 계속 간다 */
  }
}

/* ────────────────────────────────────────────────────────── *
 * 조작
 * ────────────────────────────────────────────────────────── */

el.play.addEventListener('click', toggle);
el.reset.addEventListener('click', reset);
el.hide.addEventListener('click', () => window.api?.hide());
document.getElementById('quit').addEventListener('click', () => window.api?.quit());

el.cog.addEventListener('click', () => {
  el.panel.classList.toggle('open');
  el.cog.classList.toggle('on', el.panel.classList.contains('open'));
});
document.getElementById('closeSettings').addEventListener('click', () => {
  el.panel.classList.remove('open');
  el.cog.classList.remove('on');
});

let pinned = true;
el.pin.addEventListener('click', async () => {
  pinned = await window.api?.setAlwaysOnTop(!pinned);
  el.pin.classList.toggle('on', pinned);
});
window.api?.onAlwaysOnTopChanged((flag) => {
  pinned = flag;
  el.pin.classList.toggle('on', pinned);
});

// 시간 설정 스테퍼
el.panel.querySelectorAll('.stepper').forEach((st) => {
  const key = st.dataset.key;
  const out = st.querySelector('b');
  st.querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => {
      const [min, max] = LIMITS[key];
      durations[key] = Math.min(max, Math.max(min, durations[key] + Number(b.dataset.d)));
      out.textContent = durations[key];
      window.api?.saveDurations(durations);
      // 멈춰 있는 동안 지금 구간의 길이를 바꾸면 화면에 바로 반영한다.
      if (!running && key === mode) {
        remaining = totalMs();
        render();
      }
    });
  });
});

// 단축키 — 스페이스는 시작/정지, R은 초기화
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.key === 'r' || e.key === 'R') reset();
  if (e.key === 'Escape') { el.panel.classList.remove('open'); el.cog.classList.remove('on'); }
});

/* ── 시작 ────────────────────────────────────────────────── */
(async function init() {
  const cfg = await window.api?.getConfig();
  if (cfg) {
    durations = cfg.durations;
    roundsBeforeLong = cfg.roundsBeforeLong;
    pinned = cfg.alwaysOnTop;
  }
  el.pin.classList.toggle('on', pinned);
  el.panel.querySelectorAll('.stepper').forEach((st) => {
    st.querySelector('b').textContent = durations[st.dataset.key];
  });
  remaining = totalMs();
  paintDots();
  render();
})();
</script>
</body>
</html>
