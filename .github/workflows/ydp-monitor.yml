name: 모집/신청 공고 모니터링

on:
  schedule:
    # 하루 세 번. 한 번(아침)만 돌렸더니 그날 낮에 올라온 공고가 다음 날에야
    # 보였다. 공공기관 공고는 업무시간에 올라오므로 낮 시간대에 배치한다.
    # 각 수집 뒤에 pages.yml 배포가 붙는다(아래 주석의 짝을 맞출 것).
    - cron: "40 0 * * *" # 09:40 KST -> 배포 10:00
    - cron: "0 4 * * *" # 13:00 KST -> 배포 13:20
    - cron: "0 8 * * *" # 17:00 KST -> 배포 17:40
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # 20은 러너에서 지원 종료 경고가 뜬다

      # 한 소스가 실패해도 나머지는 계속 수집한다.
      #
      # 빨간불은 사람이 봐야 할 때만 켠다. 처음엔 "ydp만 경고, 나머지는 오류"로
      # 뒀는데, 대상 사이트들이 해외 IP를 간헐적으로 막아 정부24도 같은 식으로
      # 타임아웃 나는 걸 확인했다. 그대로 두면 빨간불이 다시 무의미해진다.
      #
      # 그래서 소스 이름이 아니라 실패 종류로 가른다 (scripts/lib/exit.mjs):
      #   75 = 연결이 안 됨. 저절로 복구되므로 경고.
      #    1 = 파싱이 깨졌거나 HTTP 오류. 코드를 고쳐야 하므로 빨간불.
      # 수집은 하루 세 번 돌고 매번 최근 30일치를 다시 훑으므로, 일시적
      # 실패로 걸러진 회차는 다음 회차에 그대로 회수된다.
      - name: Collect
        run: |
          FAIL=0
          for s in ydp seoul bizinfo govkr; do
            node "scripts/${s}-monitor.mjs" && continue
            if [ $? -eq 75 ]; then
              echo "::warning::${s} 연결 실패 - 다음 회차에 회수됨"
            else
              echo "::error::${s} 수집 실패 (연결 문제가 아님 - 확인 필요)"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ydp-posts.json data/seoul-posts.json data/bizinfo-posts.json data/govkr-posts.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 모집/신청 공고 갱신"

          # PC(collect-recruit.bat)도 같은 파일을 같은 브랜치에 올린다. 하루
          # 세 번으로 늘리면서 겹칠 확률이 생겼으므로, 밀리면 한 번은 다시
          # 얹어 본다. 데이터 파일이 충돌하면 이번 회차는 포기한다 - 수집기가
          # 30일 창을 통째로 다시 훑으므로 다음 회차에 그대로 복구된다.
          git push && exit 0
          echo "::warning::push 밀림 - 원격을 받아 다시 시도"
          # origin/<브랜치>를 명시한다. 인자 없는 `git pull --rebase` 는
          # upstream 설정에 기대는데, 그게 없으면 재시도가 조용히 실패한다.
          git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort || true; echo "::warning::충돌로 이번 회차 건너뜀"; exit 0; }
          git push
