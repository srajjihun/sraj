name: 모집/신청 공고 모니터링

on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/ydp-monitor.mjs
      - run: node scripts/seoul-monitor.mjs
      - run: node scripts/bizinfo-monitor.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ydp-posts.json data/seoul-posts.json data/bizinfo-posts.json
          git diff --cached --quiet || git commit -m "chore: 모집/신청 공고 갱신"
          git push
