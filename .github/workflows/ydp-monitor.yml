name: 모집/신청 공고 모니터링

on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 한 소스가 실패해도 나머지는 계속 수집한다 (실패가 있으면 잡은 빨간색으로 남김)
      - name: Collect
        run: |
          FAIL=0
          for s in ydp seoul bizinfo govkr; do
            node "scripts/${s}-monitor.mjs" || { echo "::warning::${s} 수집 실패"; FAIL=1; }
          done
          exit $FAIL

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ydp-posts.json data/seoul-posts.json data/bizinfo-posts.json data/govkr-posts.json
          git diff --cached --quiet || git commit -m "chore: 모집/신청 공고 갱신"
          git push
