name: GitHub Pages 배포

on:
  push:
    branches: [claude/frontend-design-skill-install-pyd7nc]

  # 수집이 끝나면 곧바로 배포한다.
  #
  # 봇(GITHUB_TOKEN)이 올린 커밋은 push 트리거를 타지 않아, 수집 결과가
  # 사이트에 나오는 시점이 아래 크론에만 매달려 있었다. 크론은 혼잡하면
  # 20분씩 밀리는데 수집-배포 간격이 20분이라, 수집이 밀리면 배포가 먼저
  # 돌아 그 회차분이 다음 배포까지(최대 하루) 안 보였다. 실제로 그렇게
  # 됐다. 이 트리거가 있으면 몇 분이 밀리든 항상 수집 직후에 갱신된다.
  workflow_run:
    workflows: ["모집/신청 공고 모니터링"]
    types: [completed]

  # 위 트리거가 어떤 이유로든 놓쳤을 때를 위한 안전망으로 남겨 둔다.
  schedule:
    # 봇(GITHUB_TOKEN) 커밋은 push 트리거를 안 타므로, 수집 워크플로가 도는
    # 시각마다 한 번씩 배포한다. 수집 3회 / 배포 1회면 낮에 수집한 분이
    # 다음 날 아침까지 사이트에 안 나온다.
    # 시각은 ydp-monitor.yml 의 수집 크론과 짝이다 - 한쪽만 고치지 말 것.
    - cron: "0 1 * * *" # 10:00 KST — 09:40 수집분
    - cron: "20 4 * * *" # 13:20 KST — 13:00 수집분
    - cron: "40 8 * * *" # 17:40 KST — 17:00 수집분
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref 를 명시한다. workflow_run 이벤트의 기본 checkout 대상은 "기본
      # 브랜치의 마지막 커밋"이라 대체로 맞지만, 위 concurrency 가
      # cancel-in-progress 라 취소·재시작이 끼면 어느 커밋이 올라가는지가
      # 흐려진다. 배포는 항상 브랜치 끝을 올리는 게 맞다.
      - uses: actions/checkout@v5
        with:
          ref: claude/frontend-design-skill-install-pyd7nc

      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 자동 활성화

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
