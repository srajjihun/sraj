name: GitHub Pages 배포

on:
  push:
    branches: [claude/frontend-design-skill-install-pyd7nc]
  schedule:
    # 봇(GITHUB_TOKEN) 커밋은 push 트리거를 안 타므로, 수집 워크플로가 도는
    # 시각마다 한 번씩 배포한다. 수집 3회 / 배포 1회면 낮에 수집한 분이
    # 다음 날 아침까지 사이트에 안 나온다.
    # 시각은 ydp-monitor.yml 의 수집 크론과 짝이다 - 한쪽만 고치지 말 것.
    - cron: "0 1 * * *" # 10:00 KST — 09:40 수집분
    - cron: "20 4 * * *" # 13:20 KST — 13:00 수집분
    - cron: "40 8 * * *" # 17:40 KST — 17:00 수집분
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 자동 활성화

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
