name: GitHub Pages 배포

on:
  push:
    branches: [claude/frontend-design-skill-install-pyd7nc]
  schedule:
    - cron: "40 22 * * *" # 매일 07:40 KST — 07:00 수집 커밋 반영용 (봇 커밋은 push 트리거를 안 타므로)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 자동 활성화

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
