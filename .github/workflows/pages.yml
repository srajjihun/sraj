name: GitHub Pages 배포

on:
  push:
    branches: [claude/frontend-design-skill-install-pyd7nc]
  schedule:
    # 봇(GITHUB_TOKEN) 커밋은 push 트리거를 안 타므로, 수집 워크플로가 도는
    # 시각마다 40분 뒤에 한 번씩 배포한다. 수집 3회 / 배포 1회면 점심·저녁
    # 수집분이 다음 날 아침까지 사이트에 안 나온다.
    - cron: "40 22 * * *" # 07:40 KST — 07:00 수집분
    - cron: "40 4 * * *" # 13:40 KST — 13:00 수집분
    - cron: "40 9 * * *" # 18:40 KST — 18:00 수집분
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 자동 활성화

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
